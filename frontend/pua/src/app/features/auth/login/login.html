<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-12 sm:px-6 lg:px-8">
  
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-8 border border-slate-100">
    
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">PUA Morelos</h2>
      <p class="mt-2 text-sm text-slate-500 font-medium">Plataforma Única de Agresores</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="ingresar()" class="space-y-6">

      <div>
        <label for="email" class="block text-sm font-semibold text-slate-700">Correo Institucional</label>
        <div class="mt-1">
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            class="appearance-none block w-full px-4 py-3 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all duration-200"
            placeholder="usuario@morelos.gob.mx"
          >
        </div>
        @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
          <p class="mt-2 text-sm text-red-600 flex items-center font-medium">
            <span class="mr-1">⚠️</span> Ingresa un correo electrónico válido.
          </p>
        }
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-slate-700">Contraseña</label>
        <div class="mt-1">
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            class="appearance-none block w-full px-4 py-3 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all duration-200"
            placeholder="••••••••"
          >
        </div>
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
          <p class="mt-2 text-sm text-red-600 flex items-center font-medium">
            <span class="mr-1">⚠️</span> La contraseña es obligatoria.
          </p>
        }
      </div>

      <div>
        <button 
          type="submit" 
          [disabled]="cargando || mostrarModal"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-sky-600 hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition-all duration-200 disabled:opacity-70 disabled:cursor-not-allowed"
        >
          @if (!cargando) {
            <span>Iniciar Sesión</span>
          }
          @if (cargando) {
            <span class="flex items-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Validando credenciales...
            </span>
          }
        </button>
      </div>

    </form>
  </div>
</div>

<app-modal 
  [mostrar]="mostrarModal"
  [tipo]="tipoModal"
  [titulo]="tituloModal"
  [mensaje]="mensajeModal"
  (alCerrar)="cerrarModal()"
></app-modal>
