<aside class="h-screen w-20 bg-white border-r border-slate-200 flex flex-col relative z-20 shadow-sm">
  
  <!-- Header / Logo -->
  <div class="h-20 flex items-center justify-center border-b border-slate-200">
    <span class="text-2xl font-bold text-slate-900">PUA</span>
  </div>

  <!-- Navegación -->
  <nav class="flex flex-col py-6 px-3 flex-1 overflow-y-auto space-y-3">
    
    <!-- Dashboard Principal -->
    <a 
      routerLink="/dashboard" 
      routerLinkActive="!bg-indigo-600 !text-white shadow-md shadow-indigo-600/30" 
      title="Dashboard de Mando"
      class="flex items-center justify-center rounded-xl p-3 text-slate-900 hover:bg-slate-100 transition-all duration-200 group no-underline! focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5M9 11.25v1.5M12 9v3.75m3-6v6" />
      </svg>
    </a>

    <!-- Agresores -->
    <a 
      routerLink="/agresores" 
      routerLinkActive="!bg-indigo-600 !text-white shadow-md shadow-indigo-600/30" 
      title="Directorio de Agresores"
      class="flex items-center justify-center rounded-xl p-3 text-slate-900 hover:bg-slate-100 transition-all duration-200 group no-underline! focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
      </svg>
    </a>

    <!-- Grupos / Sedes -->
    <a 
      routerLink="/grupos" 
      routerLinkActive="!bg-indigo-600 !text-white shadow-md shadow-indigo-600/30" 
      title="Grupos y Sedes"
      class="flex items-center justify-center rounded-xl p-3 text-slate-900 hover:bg-slate-100 transition-all duration-200 group no-underline! focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
      </svg>
    </a>

    <!-- Catálogos -->
    <a 
      routerLink="/catalogos" 
      routerLinkActive="!bg-indigo-600 !text-white shadow-md shadow-indigo-600/30" 
      title="Catálogos del Sistema"
      class="flex items-center justify-center rounded-xl p-3 text-slate-900 hover:bg-slate-100 transition-all duration-200 group no-underline! focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m4.06-7.19-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
      </svg>
    </a>

    <!-- Sesiones -->
    <a 
      routerLink="/sesiones" 
      routerLinkActive="!bg-indigo-600 !text-white shadow-md shadow-indigo-600/30" 
      title="Temario de Sesiones"
      class="flex items-center justify-center rounded-xl p-3 text-slate-900 hover:bg-slate-100 transition-all duration-200 group no-underline! focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
    </a>

    <!-- Listas de Asistencia -->
    <a 
      routerLink="/listas" 
      routerLinkActive="!bg-indigo-600 !text-white shadow-md shadow-indigo-600/30" 
      title="Listas de Asistencia"
      class="flex items-center justify-center rounded-xl p-3 text-slate-900 hover:bg-slate-100 transition-all duration-200 group no-underline! focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
      </svg>
    </a>

  </nav>

  <!-- Footer / Logout -->
  <div class="p-3 border-t border-slate-200">
    <button 
      (click)="cerrarSesion()"
      title="Cerrar Sesión"
      class="w-full flex items-center justify-center p-3 text-slate-900 rounded-xl hover:bg-red-50 hover:text-red-600 transition-colors group focus:outline-none">
      <svg class="w-7 h-7 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>
</aside>
