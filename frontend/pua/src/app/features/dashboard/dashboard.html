<div class="min-h-screen bg-slate-50 p-6 lg:p-10">
  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Encabezado Principal del Dashboard -->
    <div class="border-b border-slate-200 pb-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
          Dashboard de Mando y Geointeligencia
        </h1>
        <p class="mt-1 text-sm text-slate-500">
          Monitoreo en tiempo real de expedientes, factores de riesgo psicosocial y cobertura territorial en Morelos.
        </p>
      </div>

      <div class="flex items-center gap-3">
        <div class="bg-white border border-slate-200 px-3.5 py-1.5 rounded-lg shadow-2xs text-xs text-slate-600 font-medium flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Actualizado: {{ fechaActual | date:'mediumTime' }}
        </div>

        <button 
          type="button" 
          (click)="recargarTodo()"
          class="bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow-xs transition-colors flex items-center gap-1.5 focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          Actualizar Datos
        </button>
      </div>
    </div>

    <!-- Fila 1: Tarjetas Métricas KPIs -->
    <div class="w-full">
      <app-kpi-cards></app-kpi-cards>
    </div>

    <!-- Fila 2: Geointeligencia Territorial (Mapa de Calor de Morelos a todo lo ancho) -->
    <div class="w-full">
      <app-mapa-calor></app-mapa-calor>
    </div>

    <!-- Fila 3: Gráficas Analíticas Distribuidas Lado a Lado (2 Columnas Limpias) -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
      <div class="w-full">
        <app-grafica-violencias></app-grafica-violencias>
      </div>
      <div class="w-full">
        <app-grafica-adicciones></app-grafica-adicciones>
      </div>
    </div>

    <!-- Fila 4: Tabla de Casos en Alerta de Deserción Judicial -->
    <div class="w-full">
      <app-tabla-alertas></app-tabla-alertas>
    </div>

  </div>
</div>
