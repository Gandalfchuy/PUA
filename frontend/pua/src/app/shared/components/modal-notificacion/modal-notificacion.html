@if (mostrar) {
  <div class="relative z-50" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity"></div>

    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        
        <div class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-sm">
          <div class="bg-white px-4 pb-6 pt-6 sm:p-8">
            
            <!-- Contenedor flex en columna y centrado -->
            <div class="flex flex-col items-center justify-center">
              
              <!-- Icono dinámico centrado y ligeramente más grande -->
              <div 
                class="mx-auto flex h-16 w-16 shrink-0 items-center justify-center rounded-full"
                [ngClass]="{
                  'bg-emerald-100': tipo === 'exito', 
                  'bg-red-100': tipo === 'error',
                  'bg-amber-100': tipo === 'confirmacion'
                }"
              >
                @if (tipo === 'exito') {
                  <svg class="h-8 w-8 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                  </svg>
                }
                @if (tipo === 'error') {
                  <svg class="h-8 w-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                }
                @if (tipo === 'confirmacion') {
                  <svg class="h-8 w-8 text-amber-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                }
              </div>
              
              <!-- Textos forzados al centro -->
              <div class="mt-4 text-center">
                <h3 class="text-lg font-semibold leading-6 text-slate-900" id="modal-title">
                  {{ titulo }}
                </h3>
                <div class="mt-2">
                  <p class="text-sm text-slate-500">
                    {{ mensaje }}
                  </p>
                </div>
              </div>
              
            </div>
          </div>
          
          <!-- Zona de Botones Dinámica y Centrada -->
          <div class="bg-slate-50 px-4 py-4 border-t border-slate-200 sm:px-6 flex flex-col sm:flex-row justify-center gap-3">
            
            @if (tipo === 'confirmacion') {
              <!-- Dos botones centrados (en móvil se apilan, en escritorio se ponen lado a lado) -->
              <button type="button" (click)="confirmar()" class="inline-flex w-full sm:w-auto justify-center rounded-lg bg-red-600 hover:bg-red-500 px-6 py-2 text-sm font-semibold text-white shadow-sm transition-colors">
                Eliminar Registro
              </button>
              <button type="button" (click)="cerrar()" class="inline-flex w-full sm:w-auto justify-center rounded-lg bg-white px-6 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 transition-colors">
                Cancelar
              </button>
            } @else {
              <!-- Un solo botón centrado -->
              <button type="button" (click)="cerrar()" class="inline-flex w-full sm:w-auto min-w-30 justify-center rounded-lg px-6 py-2 text-sm font-semibold text-white shadow-sm transition-colors" [ngClass]="{'bg-emerald-600 hover:bg-emerald-500': tipo === 'exito', 'bg-red-600 hover:bg-red-500': tipo === 'error'}">
                Entendido
              </button>
            }

          </div>
          
        </div>
      </div>
    </div>
  </div>
}
