<div class="fixed inset-0 z-60 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-all p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-full">
    
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
      <h3 class="text-lg font-bold text-slate-800">Registrar Proceso de Reeducación</h3>
      <button type="button" (click)="cerrado.emit()" class="text-slate-400 hover:text-red-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="overflow-y-auto p-6 grow">
      <form [formGroup]="formulario" (ngSubmit)="guardar()" id="form-proceso" class="grid grid-cols-1 md:grid-cols-2 gap-5">
        
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Fecha de Inicio *</label>
          <input type="date" formControlName="fecha_inicio" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 cursor-pointer">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Fecha de Término</label>
          <input type="date" formControlName="fecha_termino" [min]="fechaInicioSeleccionada" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 cursor-pointer disabled:bg-slate-100 disabled:text-slate-400">
        </div>

        <div class="md:col-span-2 border-t border-slate-100 my-2"></div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Fecha de Denuncia</label>
          <input type="date" formControlName="fecha_denuncia" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 cursor-pointer">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Folio Carpeta Fiscalía</label>
          <input type="text" formControlName="folio_carpeta_fiscalia" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-1">Nombre del Denunciante</label>
          <input type="text" formControlName="denunciante" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500">
        </div>

        <div class="md:col-span-2 border-t border-slate-100 my-2"></div>

        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-1">Motivo de Ingreso *</label>
          <select formControlName="motivo_ingreso_id" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500">
             <option [ngValue]="null">{{ cargandoCatalogos ? 'Cargando...' : 'Seleccione...' }}</option>
             @for (item of catalogos.motivos; track item.id) { <option [value]="item.id">{{ item.nombre }}</option> }
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Tipo de Violencia *</label>
          <select formControlName="tipo_violencia_id" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500">
             <option [ngValue]="null">{{ cargandoCatalogos ? 'Cargando...' : 'Seleccione...' }}</option>
             @for (item of catalogos.tipos; track item.id) { <option [value]="item.id">{{ item.nombre }}</option> }
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Modalidad de Violencia *</label>
          <select formControlName="modalidad_violencia_id" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500">
             <option [ngValue]="null">{{ cargandoCatalogos ? 'Cargando...' : 'Seleccione...' }}</option>
             @for (item of catalogos.modalidades; track item.id) { <option [value]="item.id">{{ item.nombre }}</option> }
          </select>
        </div>

      </form>
    </div>

    <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end space-x-3 shrink-0">
      <button type="button" (click)="cerrado.emit()" class="px-5 py-2 text-slate-600 bg-slate-200 hover:bg-slate-300 rounded-lg font-medium">Cancelar</button>
      <button type="submit" form="form-proceso" [disabled]="cargando" class="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-lg font-medium disabled:opacity-50">Guardar Proceso</button>
    </div>

  </div>
</div>
