<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col h-full">
  
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4 mb-4">
    <div>
      <h3 class="text-base font-bold text-slate-900 flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 mr-2 text-indigo-600">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
        </svg>
        Geointeligencia: Concentración Territorial (Morelos)
      </h3>
      <p class="text-xs text-slate-500 mt-0.5">Densidad de residencia de agresores y cobertura de sedes comunitarias</p>
    </div>

    <!-- Controles de Capas -->
    <div class="flex items-center gap-2">
      <button 
        type="button" 
        (click)="toggleCalor()"
        [ngClass]="mostrarCalor ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600'"
        class="text-xs font-semibold px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full" [ngClass]="mostrarCalor ? 'bg-amber-300' : 'bg-slate-400'"></span>
        Mapa de Calor
      </button>

      <button 
        type="button" 
        (click)="toggleSedes()"
        [ngClass]="mostrarSedes ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600'"
        class="text-xs font-semibold px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full" [ngClass]="mostrarSedes ? 'bg-sky-400' : 'bg-slate-400'"></span>
        Sedes ({{ mapData?.sedes?.length || 0 }})
      </button>
    </div>
  </div>

  <!-- Contenedor del Mapa -->
  <div class="relative w-full rounded-xl overflow-hidden border border-slate-100 bg-slate-50" style="height: 380px; min-height: 380px;">
    @if (cargando) {
      <div class="absolute inset-0 z-10 bg-slate-50/80 flex flex-col items-center justify-center backdrop-blur-xs">
        <div class="w-8 h-8 rounded-full border-2 border-indigo-600 border-t-transparent animate-spin mb-2"></div>
        <span class="text-xs font-medium text-slate-600">Cargando mapa de geointeligencia...</span>
      </div>
    }

    <div #mapContainer class="w-full h-full" style="height: 380px; min-height: 380px; width: 100%;"></div>
  </div>

  <!-- Pie de mapa con leyenda -->
  <div class="mt-3 flex flex-wrap items-center justify-between text-[11px] text-slate-500 pt-2 border-t border-slate-50">
    <div class="flex items-center gap-2">
      <span class="font-medium text-slate-600">Gradiente Térmico:</span>
      <span class="inline-flex items-center gap-1">
        <span class="w-3 h-2 rounded-sm bg-sky-400"></span> Baja
      </span>
      <span class="inline-flex items-center gap-1">
        <span class="w-3 h-2 rounded-sm bg-amber-400"></span> Media
      </span>
      <span class="inline-flex items-center gap-1">
        <span class="w-3 h-2 rounded-sm bg-rose-500"></span> Alta Densidad
      </span>
    </div>
    <div class="font-mono text-slate-400">
      EPSG:4326 (PostGIS)
    </div>
  </div>

</div>
