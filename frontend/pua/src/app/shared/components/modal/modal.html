@if (mostrar) {
  <div class="relative z-50" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    
    <div class="fixed inset-0 bg-slate-900 bg-opacity-75 transition-opacity"></div>

    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
      <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
        
        <div class="relative transform overflow-hidden rounded-2xl bg-white shadow-2xl transition-all sm:my-8 w-full sm:max-w-md border border-slate-200">
          
          <div class="bg-white px-6 py-8">
            <div class="flex flex-col items-center justify-center">
              
              @if (tipo === 'error') {
                <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full bg-red-100 mb-4">
                  <svg class="h-8 w-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                </div>
              }

              @if (tipo === 'exito' || tipo === 'acceso_autorizado') {
                <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full bg-green-100 mb-4">
                  <svg class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
              }

              <div class="text-center">
                <h3 class="text-xl font-bold leading-6 text-slate-900" id="modal-title">
                  {{ titulo }}
                </h3>
                <div class="mt-3">
                  <p class="text-sm text-slate-500 px-2">
                    {{ mensaje }}
                  </p>
                </div>
              </div>

            </div>
          </div>
          
          <div class="bg-slate-50 px-6 py-4 flex justify-center border-t border-slate-100">
            <button 
              type="button" 
              (click)="cerrar()" 
              class="inline-flex w-full sm:w-2/3 justify-center rounded-lg bg-slate-800 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-slate-700 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2"
            >
              Entendido
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>
}
